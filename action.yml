name: "Publish Saddle Bag"
description: "Builds and publishes a Docker saddle bag image to a container registry"

inputs:
  registry:
    description: "Container registry URL (e.g. ghcr.io)"
    required: true
  username:
    description: "Registry username"
    required: true
  password:
    description: "Registry password or token"
    required: true
  images:
    description: "Image name(s) passed to docker/metadata-action (one per line)"
    required: true
  version:
    description: "Saddle bag version (overrides quarkus.application.version)"
    required: false
    default: ${{ github.ref_name }}
  prerelease:
    description: "Whether this is a prerelease (disables the 'latest' tag when 'true')"
    required: false
    default: "false"
  working-directory:
    description: "Directory where the Gradle build is executed"
    required: false
    default: "."
  context:
    description: "Docker build context path (defaults to working-directory)"
    required: false
    default: ""
  dockerfile:
    description: "Path to the Dockerfile (defaults to working-directory/Dockerfile)"
    required: false
    default: ""
  tags:
    description: "Tag patterns passed to docker/metadata-action (one per line)"
    required: false
    default: ""
  labels:
    description: "Extra labels passed to docker/metadata-action (one per line, KEY=VALUE)"
    required: false
    default: ""
  annotations:
    description: "Extra annotations passed to docker/metadata-action (one per line, [TYPE:]KEY=VALUE)"
    required: false
    default: ""
  docker-build-args:
    description: "Docker build arguments (one per line, NAME=VALUE)"
    required: false
    default: ""
  quarkus-build-args:
    description: "Quarkus build arguments (space-separated, e.g. -Dkey=value)"
    required: false
    default: ""
  platforms:
    description: "Architecture platforms"
    required: false
    default: "linux/amd64,linux/arm64"

outputs:
  tags:
    description: "Docker image tags produced by the build"
    value: ${{ steps.meta.outputs.tags }}
  digest:
    description: "Docker image digest"
    value: ${{ steps.build.outputs.digest }}
  metadata:
    description: "Build result metadata (JSON)"
    value: ${{ steps.build.outputs.metadata }}

runs:
  using: "composite"
  steps:
    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        java-version: "25"
        distribution: "temurin"

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Build Slack Saddle Bag
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        IMAGES: ${{ inputs.images }}
      run: |
        docker_image="$(printf '%s\n' "$IMAGES" | head -n 1)"
        gradle build \
          -Dquarkus.application.version="${{ inputs.version }}" \
          -Dquarkus.littlehorse.saddle.bag.output.format=properties \
          -Dquarkus.littlehorse.saddle.bag.output.enable=true \
          -Dquarkus.littlehorse.saddle.bag.output.path=saddle-bag/ \
          -Dquarkus.littlehorse.saddle.bag.output.filename=saddle-bag \
          -Dquarkus.littlehorse.saddle.bag.metadata.docker-image="$docker_image" \
          ${{ inputs.quarkus-build-args }}

    - name: Login to Registry
      uses: docker/login-action@v4
      with:
        registry: ${{ inputs.registry }}
        username: ${{ inputs.username }}
        password: ${{ inputs.password }}

    - name: Read OCI annotations
      id: oci
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        delim="EOF_$(openssl rand -hex 8)"
        {
          echo "annotations<<$delim"
          sed 's/^/io.littlehorse.saddle.bag./' build/saddle-bag/saddle-bag.properties
          echo "$delim"
        } >> "$GITHUB_OUTPUT"

    - name: Extract Metadata
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: ${{ inputs.images }}
        tags: |
          type=raw,value=latest,enable=${{ inputs.prerelease == 'false' }}
          type=raw,value=${{ inputs.version }},enable=true
          ${{ inputs.tags }}
        labels: |
          ${{ inputs.labels }}
          ${{ steps.oci.outputs.annotations }}
        annotations: |
          ${{ inputs.annotations }}
          ${{ steps.oci.outputs.annotations }}
      env:
        DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index

    - name: Build and push
      id: build
      uses: docker/build-push-action@v7
      with:
        context: ${{ inputs.context || inputs.working-directory }}
        file: ${{ inputs.dockerfile || format('{0}/Dockerfile', inputs.working-directory) }}
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        annotations: ${{ steps.meta.outputs.annotations }}
        build-args: ${{ inputs.docker-build-args }}
        platforms: ${{ inputs.platforms }}

    - name: Write published image summary
      shell: bash
      run: |
        {
          echo "## Published Docker Image Tags"
          echo
          echo "The following tags were pushed:"
          echo
          while IFS= read -r tag; do
            [ -n "$tag" ] && echo "- \`$tag\`"
          done <<< "${{ steps.meta.outputs.tags }}"
        } >> "$GITHUB_STEP_SUMMARY"
