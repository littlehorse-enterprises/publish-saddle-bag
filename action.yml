name: 'Publish Saddle Bag'
description: 'Builds and publishes a Docker saddle bag image to a container registry'

inputs:
  registry:
    description: 'Container registry URL (e.g. ghcr.io)'
    required: true
  username:
    description: 'Registry username'
    required: true
  password:
    description: 'Registry password or token'
    required: true
  images:
    description: 'Image name(s) passed to docker/metadata-action (one per line)'
    required: true
  context:
    description: 'Docker build context path'
    required: false
    default: '.'
  file:
    description: 'Path to the Dockerfile (defaults to {context}/Dockerfile)'
    required: false
    default: ''
  tags:
    description: 'Tag patterns passed to docker/metadata-action (one per line)'
    required: false
    default: ''
  labels:
    description: 'Extra labels passed to docker/metadata-action (one per line, KEY=VALUE)'
    required: false
    default: ''
  annotations:
    description: 'Extra annotations passed to docker/metadata-action (one per line, [TYPE:]KEY=VALUE)'
    required: false
    default: ''
  build-args:
    description: 'Docker build arguments (one per line, NAME=VALUE)'
    required: false
    default: ''

outputs:
  tags:
    description: 'Docker image tags produced by the build'
    value: ${{ steps.meta.outputs.tags }}
  digest:
    description: 'Docker image digest'
    value: ${{ steps.build.outputs.digest }}
  metadata:
    description: 'Build result metadata (JSON)'
    value: ${{ steps.build.outputs.metadata }}

runs:
  using: 'composite'
  steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'temurin'

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Build Slack Saddle Bag
      shell: bash
      run: gradle build -Dquarkus.littlehorse.saddle.bag.output.format=properties

    - name: Login to Registry
      uses: docker/login-action@v4
      with:
        registry: ${{ inputs.registry }}
        username: ${{ inputs.username }}
        password: ${{ inputs.password }}

    - name: Read OCI annotations
      id: oci
      shell: bash
      run: |
        delim="EOF_$(openssl rand -hex 8)"
        {
          echo "annotations<<$delim"
          sed 's/^/io.littlehorse.saddle.bag./' bags/slack/build/saddle-bag/saddle-bag.properties
          echo "$delim"
        } >> "$GITHUB_OUTPUT"

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: ${{ inputs.images }}
        tags: ${{ inputs.tags }}
        labels: ${{ inputs.labels }}
        annotations: ${{ inputs.annotations }}

    - name: Build and push
      id: build
      uses: docker/build-push-action@v7
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.file }}
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        annotations: |
          ${{ steps.meta.outputs.annotations }}
          ${{ steps.oci.outputs.annotations }}
        build-args: ${{ inputs.build-args }}
